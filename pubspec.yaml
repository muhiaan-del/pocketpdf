name: pocketpdf
description: Offline PDF editor, scanner, and annotator.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0          # Pick PDFs (v13 uses FilePicker.pickFile)
  path_provider: ^2.1.0         # App directories
  share_plus: ^13.1.0           # Share/export (win32 6.x compatible)
  permission_handler: ^11.3.0
  cupertino_icons: ^1.0.6
  dart_pdf_editor: ^5.1.0
  dart_pdf_editor_assets: ^5.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true