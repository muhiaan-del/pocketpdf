name: pocketpdf
description: Offline PDF editor, scanner, and annotator.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^13.1.0
  path_provider: ^2.1.0
  share_plus: ^13.1.0
  permission_handler: ^12.0.3
  cupertino_icons: ^1.0.6
  dart_pdf_editor: ^5.1.0
  dart_pdf_editor_assets: ^5.1.0
  cunning_document_scanner: ^2.8.0
  path: ^1.8.0
  pdf: ^3.11.1
  image: ^4.2.0
  image_picker: ^1.1.2

  

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true